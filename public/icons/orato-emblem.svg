<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Master artwork for every Orato icon: the orator mark in gold (#C9A876)
    inside a double gold ring, on a textured deep-wine (#4A1420) ground.
    The figure paths are the same ones the header and splash use, so the
    home-screen icon, the header logo and the splash are one artwork.

    This SVG is only the *fallback* source. scripts/generate-icons.mjs
    renders it to public/icons/orato-logo-source.png once; after that the
    PNG is the source of truth, so dropping a photographic logo over
    orato-logo-source.png and re-running the script swaps the whole set.
  -->
  <defs>
    <!-- Wine ground: lit from above-centre, falling to near-black at the rim -->
    <radialGradient id="wine" cx="50%" cy="40%" r="76%">
      <stop offset="0%" stop-color="#5E1A2A"/>
      <stop offset="52%" stop-color="#4A1420"/>
      <stop offset="100%" stop-color="#2A0810"/>
    </radialGradient>
    <!-- Two off-centre washes give the flat fill a poured, uneven texture -->
    <radialGradient id="wash-a" cx="28%" cy="24%" r="46%">
      <stop offset="0%" stop-color="#7A2438" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7A2438" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-b" cx="76%" cy="80%" r="52%">
      <stop offset="0%" stop-color="#1E060C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1E060C" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold has a slight vertical falloff so it reads as metal, not paint.
         Both use userSpaceOnUse: the default objectBoundingBox units collapse
         on the figure's perfectly vertical strokes (zero-width box), which
         drops those paths from the render entirely. -->
    <linearGradient id="gold-ring" gradientUnits="userSpaceOnUse" x1="512" y1="40" x2="512" y2="984">
      <stop offset="0%" stop-color="#E4CE9C"/>
      <stop offset="46%" stop-color="#C9A876"/>
      <stop offset="100%" stop-color="#A8874F"/>
    </linearGradient>
    <!-- Figure coordinates live in the inner 512-box, before the group transform -->
    <linearGradient id="gold-figure" gradientUnits="userSpaceOnUse" x1="295" y1="118" x2="295" y2="442">
      <stop offset="0%" stop-color="#E4CE9C"/>
      <stop offset="46%" stop-color="#C9A876"/>
      <stop offset="100%" stop-color="#A8874F"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#wine)"/>
  <rect width="1024" height="1024" fill="url(#wash-a)"/>
  <rect width="1024" height="1024" fill="url(#wash-b)"/>

  <!-- Double gold ring -->
  <circle cx="512" cy="512" r="472" fill="none" stroke="url(#gold-ring)" stroke-width="14"/>
  <circle cx="512" cy="512" r="446" fill="none" stroke="#C9A876" stroke-width="3" stroke-opacity="0.42"/>

  <!-- The orator and the lectern column, centred inside the rings -->
  <g transform="translate(512 512) scale(1.95) translate(-295 -280)">
    <g fill="none" stroke="url(#gold-figure)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M372 150 V430"/><path d="M418 150 V430"/>
      <path d="M388 162 V420" stroke-width="6"/><path d="M402 162 V420" stroke-width="6"/>
      <path d="M360 150 C360 136 366 130 378 130 H412 C424 130 430 136 430 150"/>
      <path d="M360 430 H430"/>
      <path d="M214 214 C200 202 196 170 208 150 C215 135 230 127 244 132 C254 136 258 143 258 151 L272 188 C274 194 271 199 264 199 L257 205 C262 212 263 221 256 231 C249 243 233 245 224 238 C217 233 215 224 215 214 Z"/>
      <path d="M198 150 m-13 0 a13 13 0 1 0 26 0 a13 13 0 1 0 -26 0" stroke-width="8"/>
      <path d="M212 154 C226 145 246 147 256 156" stroke-width="7"/>
      <path d="M222 240 L216 266"/><path d="M256 232 C258 248 254 258 262 270"/>
      <path d="M262 272 C300 264 324 240 332 210 C338 188 346 172 356 162"/>
      <path d="M356 162 C363 155 370 154 375 160" stroke-width="8"/>
      <path d="M216 266 C188 274 168 292 160 322"/>
      <path d="M262 270 C282 300 292 336 288 372"/>
      <path d="M206 288 C220 320 244 342 258 372" stroke-width="6"/>
      <path d="M182 306 C214 326 246 336 276 332" stroke-width="6"/>
      <path d="M164 322 C176 348 202 360 232 352"/>
      <path d="M232 344 L232 362" stroke-width="8"/>
      <path d="M160 372 C200 392 250 390 288 372" stroke-width="9"/>
    </g>
  </g>
</svg>
